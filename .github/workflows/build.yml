name: Build

# Normal branch pushes do not build. Manual runs can optionally publish the
# package.json version; pushing its matching v-prefixed tag also publishes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish installers as a GitHub prerelease (bump package version first)
        type: boolean
        default: false

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # `**` glob file-args to `--test` need a newer Node than the pinned
        # runner version supports, so enumerate files with `find` instead of
        # relying on the shell/runtime to expand the pattern. `resources/` holds
        # the shared permission-rules engine's tests, so include it too.
        run: npx --no-install tsx --test $(find src resources -name '*.test.ts')

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            eb_args: '--linux AppImage --x64'
            artifacts: |
              release/*.AppImage
              release/*.sha256
          - os: windows-latest
            eb_args: '--win nsis portable --x64'
            artifacts: |
              release/*.exe
              release/*.sha256
          - os: macos-15
            eb_args: '--mac dmg zip --arm64'
            artifacts: |
              release/*.dmg
              release/*.zip
              release/*.sha256
          - os: macos-15-intel
            eb_args: '--mac dmg zip --x64'
            artifacts: |
              release/*.dmg
              release/*.zip
              release/*.sha256

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Select Xcode for Icon Composer assets
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Test bootstrap installers
        run: node --test scripts/install.test.js

      # Runs postinstall, which rebuilds native modules (node-pty) for Electron.
      # NOTE: confirmed (2026-06-08) that the windows-latest runner's bundled
      # Visual Studio already includes the Spectre-mitigated MSVC libs node-pty
      # needs — it compiles here with no explicit install step. An earlier
      # vs_installer step worked but added ~4 min for nothing, so it was removed.
      # (People building from source on their own machines may still need those
      # libs — see README.)
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer/main/preload
        run: npm run build

      - name: Package with electron-builder
        shell: bash
        run: npx --no-install electron-builder ${{ matrix.eb_args }} --publish never
        env:
          # No certificates in alpha — don't attempt to sign the macOS app.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate installer checksums
        run: node scripts/release-checksums.js

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish prerelease
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Refuse to publish a version belonging to another commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tagged_commit=$(git rev-list -n 1 "$RELEASE_TAG")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$RELEASE_TAG already belongs to another commit. Bump package.json and package-lock.json before publishing."
              exit 1
            fi
          fi

      - name: Download all installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Attaches the built installers to the release for this tag. If you
      # pre-created the release in the GitHub UI with your own notes, those
      # notes are preserved (no generate_release_notes, no body input). If the
      # tag was pushed without a release, one is created with an empty body.
      - name: Attach installers to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.verify.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/**/*
